name: Create Version Tag

on:
  push:
    branches:
      - main
      - develop

jobs:
  tag-release:
    name: Tag ${{ github.ref_name == 'main' && 'release' || 'prerelease' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/brewfather/manifest.json)
          [[ "$VERSION" != v* ]] && VERSION="v${VERSION}"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            TAG_NAME="${VERSION}"
          else
            TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
            TAG_NAME="${VERSION}-beta.${TIMESTAMP}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create version tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          TAG_MESSAGE="${{ github.ref_name == 'main' && 'Release' || 'Pre-release' }} ${TAG_NAME}

          Commit: ${{ github.sha }}
          Tagged: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Branch: ${{ github.ref_name }}
          Trigger: ${{ github.event_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "$TAG_MESSAGE"
          git push origin "$TAG_NAME"

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            --draft \
            --generate-notes \
            --title "$TAG_NAME" \
            ${{ github.ref_name != 'main' && '--prerelease' || '' }}
